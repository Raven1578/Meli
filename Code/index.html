<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MWEHEHEHE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="desktop">
    <div class="desktop-icon">
      <div>💻</div>
      <span>Our Computer</span>
    </div>

    <div class="desktop-icon">
      <div>📁</div>
      <span>Files</span>
    </div>

    <div class="window-container" id="windowContainer">

      <div class="window active" id="introWindow">
        <div class="title-bar">
          <span>Message.exe</span>
          <button class="title-close" id="introClose">×</button>
        </div>

        <div class="window-content">
          <div class="message-row">
            <p>
              Hi Meli!<br><br>
              I would like to ask you something
            </p>
          </div>

          <div class="window-buttons">
            <button class="win-button" id="continueButton">
              OK
            </button>
          </div>
        </div>
      </div>

      <div class="window" id="questionWindow">
        <div class="title-bar">
          <span id="windowTitle">Important Question.exe</span>
          <button class="title-close" id="closeButton">×</button>
        </div>

        <div class="window-content">
          <div class="message-row">
            <p id="questionText">
              May I court you?
            </p>
          </div>

          <div class="window-buttons">
            <button class="win-button yes-button" id="yesButton">
              YES
            </button>

            <button class="win-button" id="noButton">
              NO
            </button>
          </div>
        </div>
      </div>

      <div class="window" id="finalWindow">
        <div class="title-bar">
          <span>Success.exe</span>
        </div>

        <div class="window-content">
          <div class="message-row">
            <p>
              YEHEYY!!! <br><br>
              Thank you, Meli!<br>
              Im really happy, I promise you Ill stay consistent and do my best to make you happy ganda!
            </p>
          </div>

          <div class="window-buttons">
            <button class="win-button" id="finishButton">
              OK
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="taskbar">
      <button class="start-button">Windows</button>
      <span id="clock"></span>
    </div>
  </div>

  <audio id="backgroundMusic"
         src="audio/background-music.mp3"
         loop></audio>

  <script src="script.js"></script>
</body>
</html>
